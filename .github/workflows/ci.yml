name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx

      - name: Run tests
        run: pytest tests -v

  workspace:
    name: Workspace navigation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI development tools
        run: npm ci --ignore-scripts
      - name: Lint modules and verify workspace interactions
        run: |
          npm run lint
          npm test

  notebook:
    name: Isolated notebook runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the workbench
        run: pip install -e . pytest httpx
      - name: Build the optional runtime
        run: epsilon notebook-build
      - name: Verify real execution and isolation
        env:
          EPSILON_TEST_NOTEBOOK: "1"
        run: pytest tests/test_workbench.py::test_real_isolated_jupyter_state_outputs_and_stop -v
